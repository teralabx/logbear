name: Bug report
description: Something runlog did that it should not have
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security or privacy issue — captured credentials, environment variable
        values reaching disk, an agent query reading outside its project — please do not
        file it here. See [SECURITY.md](../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The exact command you wrapped, and the steps from a clean state. Setting
        `RUNLOG_HOME` to a scratch directory makes a reproduction independent of your real
        history.
      placeholder: |
        1. RUNLOG_HOME=/tmp/rl-repro runlog npm run dev
        2. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `runlog doctor`
      description: This is pasted into a code block automatically, so no backticks needed.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "`runlog --version`, and how you installed it (Homebrew, cargo, the app)."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: macOS version and chip
      placeholder: "15.2, Apple M2"
    validations:
      required: true

  - type: input
    id: wrapped
    attributes:
      label: What you were wrapping
      description: The runtime and version, since capture is per-runtime.
      placeholder: "Elixir 1.17 / mix phx.server"
