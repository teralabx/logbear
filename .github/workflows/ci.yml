name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    # macOS is the supported platform, and the PTY and launchd paths only exist here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      # tauri-build refuses to compile the desktop crate unless every `externalBin` sidecar
      # exists, and those are build outputs (`scripts/sidecars.sh`), never committed.
      # Nothing here bundles the app, so empty stand-ins are enough to let it compile.
      - name: Stub the Tauri sidecars
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          for bin in logbear logbeard logbear-mcp logbear-hook; do
            touch "apps/desktop/src-tauri/binaries/$bin-$triple"
          done

      # No `cargo fmt --check`: this codebase is hand-formatted wider than rustfmt's
      # defaults, and adopting them is a 39-file mechanical diff nobody has asked for.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # These spawn the real binary under a PTY, so they are ignored by default.
      - run: cargo test -p logbear -- --ignored

  msrv:
    name: Minimum Rust version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read rather than repeated, so the job checks what the manifest declares.
      - name: Read the declared version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      # See the Rust job: the desktop crate will not compile without these.
      - name: Stub the Tauri sidecars
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          for bin in logbear logbeard logbear-mcp logbear-hook; do
            touch "apps/desktop/src-tauri/binaries/$bin-$triple"
          done

      - run: cargo check --workspace --all-targets --locked

  frontend:
    name: Desktop frontend
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run test

      - run: bun run build

  manifest:
    name: Packaging metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      # Catches a manifest that cannot be published — a missing description, a licence
      # file that does not resolve — before a release depends on it.
      #
      # Only `logbear-core` for now: `cargo package` resolves dependencies against the
      # real index, so every crate that depends on it — `logbear-setup` first — cannot be
      # packaged until it has been published once. Add them after the first release.
      - run: cargo package -p logbear-core --no-verify
