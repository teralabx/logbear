name: Release

# Pushing a `v*` tag builds the four binaries for both macOS architectures, publishes them
# as a GitHub release with a SHA-256 beside each archive, updates the Homebrew tap, and
# publishes the crates to crates.io. `install.sh` and the formula both download exactly the
# release assets; `cargo install` builds from the published crates.
#
# Separate jobs so that a failure in one can be re-run alone. The release cannot be created
# twice, and the tap and crates.io have to be able to catch up after it exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      # A tag that disagrees with the manifest ships binaries whose `--version` lies, and
      # `logbear upgrade` compares against that version.
      - name: Check the tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match workspace version $manifest" >&2
            exit 1
          fi

      # tauri-build refuses to compile the desktop crate unless every `externalBin` sidecar
      # exists, and those are build outputs (`scripts/sidecars.sh`), never committed.
      # Nothing here bundles the app, so empty stand-ins are enough to let it compile.
      - name: Stub the Tauri sidecars
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          for bin in logbear logbeard logbear-mcp logbear-hook; do
            touch "apps/desktop/src-tauri/binaries/$bin-$triple"
          done

      - run: cargo test --workspace

      - name: Build and package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" \
              -p logbear -p logbeard -p logbear-mcp -p logbear-hook
            stage="logbear-$version-$target"
            mkdir -p "$stage"
            for bin in logbear logbeard logbear-mcp logbear-hook; do
              cp "target/$target/release/$bin" "$stage/"
            done
            cp LICENSE.md README.md "$stage/"
            tar -czf "dist/$stage.tar.gz" "$stage"
            (cd dist && shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256")
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac

          # This version's changelog section, or GitHub's generated list if it has none,
          # which is the normal case for a pre-release.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[.*\]: /) { exit }
            found
          ' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes)
          fi

          gh release create "$GITHUB_REF_NAME" dist/* --title "logbear $version" "${flags[@]}"

  homebrew:
    name: Update the tap
    needs: publish
    # A pre-release must not reach anyone who runs `brew upgrade`.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hashes come back from the release rather than from an earlier job, so this job
      # works alone on a re-run.
      - name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          hash_of() {
            gh release download "$GITHUB_REF_NAME" \
              --pattern "logbear-$version-$1.tar.gz.sha256" --output - | cut -d' ' -f1
          }
          scripts/render-formula.sh "$version" \
            "$(hash_of aarch64-apple-darwin)" "$(hash_of x86_64-apple-darwin)" > logbear.rb

      - name: Push it to the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set: see packaging/homebrew/README.md" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/tap_key"
          (umask 077 && printf '%s\n' "$TAP_DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone git@github.com:teralabx/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp logbear.rb "$RUNNER_TEMP/tap/Formula/logbear.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/logbear.rb
          if git diff --cached --quiet; then
            echo "the tap already has this version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "logbear ${GITHUB_REF_NAME#v}"
          git push origin HEAD

      - name: Install from the tap, as a user would
        run: |
          brew install teralabx/tap/logbear
          brew test logbear

  crates:
    name: Publish to crates.io
    needs: publish
    # A published version can be yanked but never removed, so pre-releases stay off it too.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      # Dependencies first: `cargo publish` resolves against the real index, and it waits
      # for each crate to appear there before returning. A crate this version already has is
      # skipped, so a re-run finishes whatever an earlier attempt left.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set: see packaging/homebrew/README.md" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          for crate in logbear-core logbear-setup logbeard logbear-mcp logbear-hook logbear; do
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -A "logbear-release (https://github.com/teralabx/logbear)" \
              "https://crates.io/api/v1/crates/$crate/$version")"
            if [ "$status" = 200 ]; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
